<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Upload Test</title></head>
<body style="background:#111;color:#eee;font-family:sans-serif;padding:2rem;">
<h2>Teste de Upload</h2>
<form id="testForm">
<input type="file" id="testFile" name="video" accept="video/*,.mp4,.mov,.avi,.mkv,.webm" style="margin:1rem 0;font-size:1rem;"/>
<button type="submit" style="padding:0.5rem 2rem;background:#00e9bf;color:#000;border:none;border-radius:4px;font-size:1rem;cursor:pointer;">Enviar</button>
</form>
<div id="result" style="margin-top:1rem;padding:1rem;background:#222;border-radius:4px;"></div>
<script>
document.getElementById('testForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var fileInput = document.getElementById('testFile');
    var result = document.getElementById('result');
    if (!fileInput.files || !fileInput.files[0]) {
        result.textContent = 'Nenhum arquivo selecionado!';
        return;
    }
    var file = fileInput.files[0];
    result.textContent = 'Enviando ' + file.name + ' (' + (file.size/1024/1024).toFixed(1) + 'MB)...';
    var fd = new FormData();
    fd.append('video', file, file.name);
    try {
        var resp = await fetch('/api/upload', {method: 'POST', body: fd});
        var data = await resp.json();
        result.textContent = 'Resposta: ' + JSON.stringify(data, null, 2);
    } catch(err) {
        result.textContent = 'ERRO: ' + err.message;
    }
});
</script>
</body></html>
